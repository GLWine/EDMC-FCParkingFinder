[tool.ruff]
# Unified Ruff configuration for EDMC Parking Finder

[tool.ruff.lint]
# Complete set of activated rules
select = [
    "E",    # pycodestyle: style errors
    "W",    # pycodestyle: style warnings
    "F",    # Pyflakes: syntax errors and undefined names
    "I",    # isort: import sorting
    "UP",   # pyupgrade: modern Python syntax
    "B",    # flake8-bugbear: common bugs
    "SIM",  # flake8-simplify: code simplifications
    "C4",   # flake8-comprehensions: comprehension optimizations
    "N",    # pep8-naming: naming conventions
    "PTH",  # flake8-use-pathlib: use pathlib (flags os.path and open())
    "A",    # flake8-builtins: built-in shadowing
    "S",    # flake8-bandit: security
    "T20",  # flake8-print: print/pdb checks
    "RET",  # flake8-return: return statement issues
    "ERA",  # eradicate: commented-out code
    "ARG",  # flake8-unused-arguments: unused arguments
    "D",    # pydocstyle: docstrings
    "ANN",  # flake8-annotations: type hints
    "PL",   # pylint: useful pylint rules
    "RUF",  # Ruff-native: Ruff-specific rules
    "PT",   # flake8-pytest-style: pytest best practices
    "COM",  # flake8-commas: trailing commas
    "C90",  # mccabe: cyclomatic complexity
    "PERF", # perflint: performance optimizations
    "LOG",  # flake8-logging: logging best practices
    "TRY",  # tryceratops: exception handling rules
    "RSE",  # flake8-raise: raise style
    "ISC",  # flake8-implicit-str-concat: implicit string concatenation
    "INP",  # flake8-no-pep420: implicit namespace packages
    "PIE",  # flake8-pie: miscellaneous style rules
    "Q",    # flake8-quotes: quote style
    "TCH",  # flake8-type-checking: type checking imports
    "FLY",  # flynt: format to f-string conversion
    "ICN",  # flake8-import-conventions: import conventions
    "YTT",  # flake8-2020: future Python compatibility
    "EXE",  # flake8-executable: shebang and permissions
    "CPY"   # copyright headers
]

# Rules to ignore
ignore = [
    "UP032",  # do not force f-strings
    "E501",   # line-too-long (handled by the formatter)

    # Docstrings not strictly required everywhere / handling conflicts
    "D100",   # pydocstyle: undocumented public module
    "D101",   # pydocstyle: undocumented public class
    "D102",   # pydocstyle: undocumented public method
    "D103",   # pydocstyle: undocumented public function
    "D104",   # pydocstyle: undocumented public package
    "D105",   # pydocstyle: undocumented magic method
    "D107",   # pydocstyle: undocumented public init
    "D200",   # pydocstyle: one-line docstring should fit on one line
    "D203",   # pydocstyle: 1 blank line required before class docstring (ignored to prevent conflicts)
    "D205",   # pydocstyle: 1 blank line required between summary line and description
    "D213",   # pydocstyle: multi-line summary second line (ignored to prevent conflicts)
    "D401",   # pydocstyle: first line should be in imperative mood
    "D413",   # pydocstyle: missing blank line after last section

    # Pylint and Pylint-like metrics / complexity thresholds
    "PLR0911", # pylint: too-many-return-statements
    "PLR0912", # pylint: too-many-branches
    "PLR0913", # pylint: too-many-arguments
    "PLR0915", # pylint: too-many-statements
    "PLR0917", # pylint: too-many-positional-arguments
    "PLR2004", # pylint: magic-value-comparison
    "PLW0603", # pylint: global-statement (allowed for plugin state lifecycle)

    # Type annotations and unused argument relaxations for plugin hooks
    "ANN001", # flake8-annotations: missing type annotation for function argument
    "ANN002", # flake8-annotations: missing type annotation for *args
    "ARG001", # flake8-unused-arguments: unused function argument
    "ARG002", # flake8-unused-arguments: unused method argument

    # Trailing commas handled by the formatter
    "COM812", # flake8-commas: missing trailing comma

    # Other specific rules raised by logs
    "TRY003", # tryceratops: avoid specifying long messages outside exception class
    "TRY400", # tryceratops: use logging.exception instead of logging.error
    "RET505", # flake8-return: superfluous-else-return
    "B905",   # flake8-bugbear: zip-builtin-without-strict
    "CPY001", # copyright: missing copyright notice
    "INP001", # flake8-no-pep420: implicit namespace package
    "PT009"   # flake8-pytest-style: use-pytest-assert
]

# Allowed automatic fixes
fixable = [
    "E", "W", "F", "I",
    "SIM", "C4", "PIE", "Q", "COM", "ISC", "PTH", "D",
    "UP037",
    "RUF019", "RUF100"
]

# Blocked automatic fixes for safety
unfixable = [
    "F401", "F403", "F405", "S", "ANN", "PL", "TRY", "RSE", "LOG", "PERF", "N", "A", "RET"
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
