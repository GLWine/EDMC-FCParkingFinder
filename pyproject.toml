[tool.ruff]
# Custom Ruff configuration for EDMC Parking Finder

[tool.ruff.lint]
# Complete set of selected rules
select = [
    "E",    # pycodestyle: style errors
    "W",    # pycodestyle: style warnings
    "F",    # Pyflakes: syntax errors and undefined names
    "I",    # isort: import sorting
    "UP",   # pyupgrade: modern Python syntax
    "B",    # flake8-bugbear: common bugs
    "SIM",  # flake8-simplify: code simplifications
    "C4",   # flake8-comprehensions: comprehension optimizations
    "N",    # pep8-naming: naming conventions
    "PTH",  # flake8-use-pathlib: use pathlib
    "A",    # flake8-builtins: built-in shadowing
    "S",    # flake8-bandit: security
    "T20",  # flake8-print: print/pdb checks
    "RET",  # flake8-return: return statement issues
    "ERA",  # eradicate: commented-out code
    "ARG",  # flake8-unused-arguments: unused arguments
    "D",    # pydocstyle: docstring rules
    "ANN",  # flake8-annotations: type annotations
    "PL",   # pylint: useful pylint rules
    "RUF",  # Ruff-native: Ruff-specific rules
    "PT",   # flake8-pytest-style: pytest best practices
    "COM",  # flake8-commas: trailing commas
    "C90",  # mccabe: cyclomatic complexity
    "PERF", # perflint: performance optimizations
    "LOG",  # flake8-logging: logging best practices
    "TRY",  # tryceratops: exception handling rules
    "RSE",  # flake8-raise: raise style
    "ISC",  # flake8-implicit-str-concat: implicit string concatenation
    "INP",  # flake8-no-pep420: implicit namespace packages
    "PIE",  # flake8-pie: miscellaneous style rules
    "Q",    # flake8-quotes: quote style
    "TCH",  # flake8-type-checking: type checking imports
    "FLY",  # flynt: format to f-string conversion
    "ICN",  # flake8-import-conventions: import conventions
    "YTT",  # flake8-2020: future Python compatibility
    "EXE",  # flake8-executable: shebang and permissions
    "CPY"   # copyright headers
]

# Rules to ignore to prevent false positives or unnecessary blocks
ignore = [
    # Formatting and documentation string rules (D...)
    "D100", "D101", "D102", "D103", "D104", "D105", "D107",
    "D200", "D203", "D205", "D212", "D213", "D401", "D413",
    "E501", # Handled by the formatter
    
    # Type hints not strictly required everywhere (ANN...)
    "ANN001", "ANN002", "ANN201",
    
    # Unused parameters (e.g., tkinter events or EDMC hooks) (ARG...)
    "ARG001", "ARG002",
    
    # Pylint metrics (complexity and argument counts) (PLR...)
    "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004",
    
    # Pytest style guidelines (PT...)
    "PT009",
    
    # Other specific rules raised by the recent logs
    "COM812", "TRY003", "TRY400", "RET505", "B905", "T201", "CPY001", "INP001"
]

# Allowed automatic fixes
fixable = [
    "E", "W", "F", "I",
    "SIM", "C4", "PIE", "Q", "COM", "ISC",
    "UP037", "RUF019", "RUF100"
]

# Blocked automatic fixes for safety
unfixable = [
    "F401", "F403", "F405", "S", "ANN", "D", "PL", "TRY", "RSE", "LOG", "PERF", "PTH", "N", "A", "RET"
]
