name: Release EDMC Plugin

on:
  push:
    tags:
      - 'v*' # Si attiva ad ogni tag che inizia per 'v' (es. v1.1.1)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Unit Tests
        run: python test_parking_finder.py

      - name: Build Plugin ZIP Package
        run: |
          python -c "
          import os, zipfile

          tag_version = '${{ github.ref_name }}'
          zip_filename = 'ED-Parking-Finder.zip'

          # Escludiamo test, configurazioni git, file zip precedenti e cartelle di sistema
          exclude_set = {
              '.git',
              '.github',
              '.venv',
              '__pycache__',
              '.pytest_cache',
              '.vscode',
              'script',
              'test_parking_finder.py',
              '.gitignore',
              zip_filename
          }

          print(f'Creating package: {zip_filename}')
          with zipfile.ZipFile(zip_filename, 'w', zipfile.ZIP_DEFLATED) as zipf:
              # Aggiunge il file vuoto con il nome della versione direttamente nello ZIP
              if tag_version:
                  zipf.writestr(tag_version, '')
                  print(f'  Added empty version file inside zip: {tag_version}')

              # Aggiunge tutti gli altri file del progetto
              for root, dirs, files in os.walk('.'):
                  dirs[:] = [d for d in dirs if d not in exclude_set]
                  for file in files:
                      if file in exclude_set or file.endswith('.zip') or file.startswith('.'):
                          continue
                      full_path = os.path.join(root, file)
                      arcname = os.path.relpath(full_path, '.')
                      zipf.write(full_path, arcname)
                      print(f'  Added: {arcname}')
          "

      - name: Create GitHub Release and Upload Asset
        uses: softprops/action-gh-release@v1
        with:
          files: ED-Parking-Finder.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
