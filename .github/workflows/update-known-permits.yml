name: Update Spansh permit list

on:
  schedule:
    - cron: "17 5 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-known-permits
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install updater dependency
        run: python -m pip install requests

      - name: Fetch the complete permit list from Spansh
        run: python script/update_known_permits.py

      - name: Commit the refreshed list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/known_permits.json
          if git diff --cached --quiet; then
            echo "The permit list and its update timestamp are unchanged."
          else
            git commit -m "Update Spansh permit list"
            git push origin HEAD:main
          fi
