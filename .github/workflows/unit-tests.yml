# This workflow installs Python dependencies, executes unit tests, and performs code linting
name: Unit Testing

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Check out the repository source code
      - uses: actions/checkout@v4

      # Configure the target Python runtime environment
      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # Install packaging tools, testing frameworks, and optional development dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest requests
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      # Run code linting via Ruff, automatically applying rules defined in pyproject.toml
      - name: Lint with Ruff
        run: |
          ruff check .
